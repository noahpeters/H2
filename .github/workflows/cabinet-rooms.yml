name: Cabinet rooms API
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cabinet-rooms-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cabinet-rooms-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test -- --run
      - name: Configure database binding
        env:
          DATABASE_ID: ${{ vars.CABINET_ROOMS_DATABASE_ID }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const id=process.env.DATABASE_ID; if(!/^[a-f0-9-]{36}$/.test(id || "")) throw new Error("Set CABINET_ROOMS_DATABASE_ID"); const p="services/cabinet-rooms/wrangler.jsonc"; fs.writeFileSync(p,fs.readFileSync(p,"utf8").replace("REPLACE_WITH_D1_DATABASE_ID",id));'
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/cabinet-rooms
          wranglerVersion: '4.129.0'
          command: d1 migrations apply DB --remote
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/cabinet-rooms
          wranglerVersion: '4.129.0'
          command: deploy
          secrets: SERVICE_TOKEN
        env:
          SERVICE_TOKEN: ${{ secrets.CABINET_ROOMS_TOKEN }}
