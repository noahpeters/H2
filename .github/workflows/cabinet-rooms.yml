name: Cabinet rooms API
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cabinet-rooms-deploy
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: cabinet-rooms-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Verify intake delivery configuration
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FTOPS_INTAKE_URL: ${{ vars.FTOPS_INTAKE_URL }}
          FTOPS_INTAKE_TOKEN: ${{ secrets.FTOPS_INTAKE_TOKEN }}
        run: |
          for name in RESEND_API_KEY FTOPS_INTAKE_URL FTOPS_INTAKE_TOKEN; do
            if [ -z "${!name}" ]; then echo "Missing required intake setting: $name"; exit 1; fi
          done
      - name: Verify Resend inquiry automation is enabled
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/check-resend-inquiry.mjs
      - name: Configure database binding
        env:
          DATABASE_ID: ${{ vars.CABINET_ROOMS_DATABASE_ID }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const id=process.env.DATABASE_ID; if(!/^[a-f0-9-]{36}$/.test(id || "")) throw new Error("Set CABINET_ROOMS_DATABASE_ID"); const p="services/cabinet-rooms/wrangler.jsonc"; fs.writeFileSync(p,fs.readFileSync(p,"utf8").replace("REPLACE_WITH_D1_DATABASE_ID",id));'
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/cabinet-rooms
          wranglerVersion: '4.129.0'
          command: d1 migrations apply DB --remote
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/cabinet-rooms
          wranglerVersion: '4.129.0'
          command: deploy
          secrets: |
            SERVICE_TOKEN
            ADMIN_TOKEN
            RESEND_API_KEY
            FTOPS_INTAKE_URL
            FTOPS_INTAKE_TOKEN
        env:
          SERVICE_TOKEN: ${{ secrets.CABINET_ROOMS_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.CABINET_ROOMS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FTOPS_INTAKE_URL: ${{ vars.FTOPS_INTAKE_URL }}
          FTOPS_INTAKE_TOKEN: ${{ secrets.FTOPS_INTAKE_TOKEN }}

      - name: Configure optional reporting access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ANALYTICS_READ_TOKEN: ${{ secrets.CABINET_ANALYTICS_READ_TOKEN }}
        working-directory: services/cabinet-rooms
        run: |
          if [ -n "$ANALYTICS_READ_TOKEN" ]; then
            printf '%s' "$ANALYTICS_READ_TOKEN" | npx wrangler@4.129.0 secret put ANALYTICS_READ_TOKEN
          fi
