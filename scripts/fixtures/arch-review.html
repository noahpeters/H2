<!doctype html><html><head><title>Arched openings review</title><style>body{font:16px system-ui;background:#eee8df}main{display:flex}figure{margin:12px}canvas{width:440px}figcaption{text-align:center}</style></head><body><h1>Selected opening arches</h1><main></main><script type="module">
import * as THREE from 'three';import {createCustomUnit,splitSection} from '/app/studio/cabinet-configurator/custom-unit/model.ts';import {customUnitGeometry} from '/app/studio/cabinet-configurator/custom-unit/geometry.ts';import {cabinetOpeningChoices} from '/app/studio/cabinet-configurator/custom-unit/frontLayout.ts';
for(const door of [false,true]){let unit=createCustomUnit({width:48,height:48,depth:16});if(door)unit=createCustomUnit({width:24,height:36,depth:16,root:{id:'door',type:'section',sectionType:'doors',properties:{doorCount:1}}});else unit=splitSection(unit,unit.root.id,'vertical');unit.archedOpenings=[cabinetOpeningChoices(unit)[0].id];const figure=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');caption.textContent=door?'Matching arched door and frame':'Only the selected opening is arched';figure.append(canvas,caption);document.querySelector('main').append(figure);const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setSize(440,480);const scene=new THREE.Scene();scene.background=new THREE.Color('#eee8df');scene.add(new THREE.HemisphereLight(0xffffff,0x665544,2));let l=new THREE.DirectionalLight(0xffffff,2);l.position.set(30,50,-80);scene.add(l);scene.add(customUnitGeometry(unit,{}, {face:'slab',overlay:'inset',material:'paint-grade'}));const camera=new THREE.PerspectiveCamera(38,440/480,.01,500);camera.position.set(4,unit.height/2,-95);camera.lookAt(0,unit.height/2,0);renderer.render(scene,camera);}
</script></body></html>
